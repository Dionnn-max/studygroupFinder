<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Group Finder - Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Inter', Arial, sans-serif;
            color: #13295b;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        .left-side {
            width: 58%;
            background-color: #faf8f6;
            padding: 72px;
        }

        .right-side {
            width: 42%;
            background-color: #13295b;
            background-image: url("images/login-photo.jpg");
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .logo {
            display: flex;
            align-items: center;
            font-weight: 700;
            font-size: 15px;
        }

        .logo-box {
            width: 34px;
            height: 34px;
            background-color: #4fd6b8;
            border-radius: 8px;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .register-box {
            background-color: white;
            border: 1px solid #e4e7ee;
            border-radius: 6px;
            max-width: 620px;
            padding: 40px;
            margin: 80px auto 0 auto;
        }

        .register-box h2 {
            font-size: 28px;
            margin: 0;
        }

        .subtitle {
            font-size: 13px;
            color: #6b7386;
            margin-top: 8px;
            margin-bottom: 24px;
        }

        .two-col {
            display: flex;
            gap: 20px;
        }

        .two-col .field {
            width: 50%;
        }

        .field {
            margin-bottom: 18px;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        label {
            font-size: 13px;
            font-weight: 600;
        }

        .optional {
            font-size: 11px;
            color: #8a93a6;
        }

        .input-box {
            position: relative;
            margin-top: 8px;
        }

        .input-box span {
            position: absolute;
            left: 14px;
            top: 13px;
            font-size: 13px;
            color: #8a93a6;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="number"],
        select {
            width: 100%;
            height: 44px;
            border: 1px solid #cfd6e4;
            border-radius: 6px;
            padding-left: 12px;
            font-size: 14px;
            font-family: inherit;
            color: #13295b;
            background-color: white;
        }

        .input-box input {
            padding-left: 40px;
        }

        #age {
            margin-top: 8px;
        }

        .agree {
            font-size: 13px;
            margin-top: 4px;
            margin-bottom: 20px;
        }

        .agree label {
            font-weight: 400;
        }

        .agree input {
            accent-color: #2452a6;
            margin-right: 6px;
        }

        .create-btn {
            width: 100%;
            height: 48px;
            background-color: #2452a6;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
        }

        .create-btn:hover {
            background-color: #1c4390;
        }

        .bottom-text {
            text-align: center;
            font-size: 13px;
            color: #6b7386;
            margin-top: 22px;
            margin-bottom: 0;
        }

        a {
            color: #2452a6;
            font-weight: 700;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        #message {
            font-size: 13px;
            color: #c0392b;
            text-align: center;
        }

        .photo-text {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: rgba(19, 41, 91, 0.92);
            color: white;
            padding: 36px 48px 44px 48px;
        }

        .photo-text p {
            color: #4fd6b8;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1px;
            margin: 0 0 10px 0;
        }

        .photo-text h2 {
            font-size: 32px;
            font-weight: 800;
            margin: 0;
        }

        @media (max-width: 900px) {
            .right-side {
                display: none;
            }
            .left-side {
                width: 100%;
                padding: 30px 20px;
            }
            .register-box {
                margin-top: 40px;
                padding: 25px;
            }
            .two-col {
                display: block;
            }
            .two-col .field {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">

        <div class="left-side">
            <div class="logo">
                <div class="logo-box">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#13295b" stroke-width="2">
                        <path d="M12 6.5C10.5 5.2 8.3 4.5 4 4.5v13c4.3 0 6.5.7 8 2 1.5-1.3 3.7-2 8-2v-13c-4.3 0-6.5.7-8 2z"/>
                        <path d="M12 6.5v13"/>
                    </svg>
                </div>
                Study Group Finder
            </div>

            <div class="register-box">
                <h2>Create your account</h2>
                <p class="subtitle">Join your campus study community.</p>

                <form id="registerForm">
                    <div class="two-col">
                        <div class="field">
                            <label for="fullName">Full name</label>
                            <div class="input-box">
                                <span>&#9679;</span>
                                <input type="text" id="fullName" name="fullName" required>
                            </div>
                        </div>
                        <div class="field">
                            <label for="email">Student email</label>
                            <div class="input-box">
                                <span>&#9993;</span>
                                <input type="email" id="email" name="email" required>
                            </div>
                        </div>
                    </div>

                    <div class="two-col">
                        <div class="field">
                            <label for="password">Password</label>
                            <div class="input-box">
                                <span>&#9670;</span>
                                <input type="password" id="password" name="password" required>
                            </div>
                        </div>
                        <div class="field">
                            <label for="confirmPassword">Confirm password</label>
                            <div class="input-box">
                                <span>&#9670;</span>
                                <input type="password" id="confirmPassword" name="confirmPassword" required>
                            </div>
                        </div>
                    </div>

                    <div class="two-col">
                        <div class="field">
                            <label for="major">Major</label>
                            <div class="input-box">
                                <select id="major" name="major" required>
                                    <option value=""></option>
                                    <option>Computer Science</option>
                                    <option>Computer Engineering</option>
                                    <option>Mathematics</option>
                                    <option>Biology</option>
                                    <option>Business</option>
                                    <option>Psychology</option>
                                    <option>Other</option>
                                </select>
                            </div>
                        </div>
                        <div class="field">
                            <div class="label-row">
                                <label for="gender">Gender</label>
                                <span class="optional">Optional</span>
                            </div>
                            <div class="input-box">
                                <select id="gender" name="gender">
                                    <option value=""></option>
                                    <option>Female</option>
                                    <option>Male</option>
                                    <option>Non-binary</option>
                                    <option>Prefer not to say</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="field">
                        <div class="label-row">
                            <label for="age">Age</label>
                            <span class="optional">Optional</span>
                        </div>
                        <input type="number" id="age" name="age" min="16" max="99">
                    </div>

                    <div class="agree">
                        <label><input type="checkbox" id="agree" checked>I agree to the Terms and Community Guidelines.</label>
                    </div>

                    <button type="submit" class="create-btn">&rarr; &nbsp;Create Account</button>
                </form>

                <p id="message"></p>
                <p class="bottom-text">Already have an account? <a href="login.html">Log In</a></p>
            </div>
        </div>

        <div class="right-side">
            <div class="photo-text">
                <p>FIND YOUR PEOPLE</p>
                <h2>LEARN BETTER, TOGETHER</h2>
            </div>
        </div>

    </div>

    <script>
        var form = document.getElementById("registerForm");
        var message = document.getElementById("message");

        form.addEventListener("submit", function(e) {
            e.preventDefault();

            var email = document.getElementById("email").value;
            var password = document.getElementById("password").value;
            var confirmPassword = document.getElementById("confirmPassword").value;

            if (!email.endsWith(".edu")) {
                message.innerText = "Please use your student email (.edu)";
                return;
            }

            if (password != confirmPassword) {
                message.innerText = "Passwords do not match";
                return;
            }

            if (document.getElementById("agree").checked == false) {
                message.innerText = "You have to agree to the terms first";
                return;
            }

            // TODO: send this to the backend when its ready
            console.log("register clicked: " + email);
            message.innerText = "Looks good, but registration isn't connected to the backend yet.";
        });
    </script>
</body>
</html>
